# Nginx do container "web": serve o app e repassa /api ao backend (rede interna do Compose).
# Template: o entrypoint do nginx troca ${LIMITE_UPLOAD_MB} pelo valor do ambiente.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size ${LIMITE_UPLOAD_MB}m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Arquivos do build têm hash no nome: cache longo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
